<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: blue;
            font-family: "Khmer Os Muol Light", Arial;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            text-decoration: underline; //ការតុបតែងដាក់បន្ទាត់ខាងក្រោម
            text-transform: uppercase; //បម្លែងអក្សរទៅធំ/តូច
            letter-spacing: 2px; //ចន្លោះរវាងអក្សរ
        }
        p{
            color: black;
            font-family: "Khmer Os Battambang", Arial;
            font-size: 18px;
            line-height: 3; //កំណត់ចន្លោះរវាងបន្ទាត់
            text-align: inherit;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <fieldset>
        <h1>មជ្ឈមណ្ឌល ETEC</h1>

        <P>
            នៅ ETEC CENTER យើងមានជំនាញក្នុងការបង្រៀនការអភិវឌ្ឍន៍កម្មវិធីគេហទំព័រ​ 
            ការរចនាបណ្តាញ និងការថែទាំ។​ បេសកកម្មរបស់យើងគឺផ្តល់ឲសិស្សនូវជំនាញ
            បច្ចេកទេសជាក់ស្ដែងសម្រាប់ពិភពឌីជីថលទំនើប។
    </P>
    </fieldset>
</body>
</html>
