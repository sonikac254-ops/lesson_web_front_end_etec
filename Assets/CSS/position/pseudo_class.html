<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        .button{
            padding: 10px 20px;
            background-color: #4a5cff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .button:hover{
            background-color: #2c33cc;
        }
        .button:active{
            transform: scale(0.95);
        }
        input{
            padding: 8px;
            margin-top: 10px;
        }
        input:focus{
            border: 2px solid red;
            outline: none;
        }
        a:link{
            color: green;
        }
        a:visited{
            color: purple;
        }
        ul li:first-child{
            color: red;
        }
        ul li:last-child{
            color: blue;
        }
        ul li:nth-child(2){
            background-color: whitesmoke;
        }
        input[type="checkbox"]:checked{
            accent-color: green;
        }
        input:disabled{
            background-color: grey;
            cursor: not-allowed;
        }
    </style>

</head>
<body>
    <h2>1 :hover & :active</h2>
    <button class="Button">Hover/Click Me</button>
    <h2>2 :focus</h2>
    <input type="text" placeholder="Click to focus">
    <h2>3 :link & :visited</h2>
    <a href="https://www.facebook.com/" target="_blank">Go to Facebook.com</a>
    <h2>4 :first-child / :last-child / :nth-child</h2>
    <ul>
        <li>Item 1 (first-child)</li>
        <li>Item 2 (nth-child)</li>
        <li>Item 3 (last-child)</li>
    </ul>
    <h2> 5 :checked</h2>
    <label>
        <input type="checkbox"> Accept Terms
    </label>
    <h2> 6 :disabled</h2>
    <input type="text" disabled value="Disabled input">
</body>
</html>
