<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<style>
    *{
        box-sizing: border-box;
    }
    body{
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
    }
    .navbar{
        display: flex;
        align-items: center;
        background-color:  black;
        color: white;
        height: 42px;
        padding: 0 12px;
        gap: 15px;
    }
    .logo{
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .logo img{
        width: 40px;
        height: 40px;
        border-radius: 50%;
    }
    .menu{
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        white-space: nowrap;
    }
    .right-menu{
        display: flex;
        align-items: center;
        gap: 15px;
        margin-left: auto;
        font-size: 12px;
        white-space: nowrap;
    }
    .search{
        font-size: 20px;
    }
    .profile{
        border: 1px solid white;
        border-radius: 50%;
        width: 14px;
        height: 14px;
        align-items: center;
    }

</style>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="https://tse4.mm.bing.net/th/id/OIP.3Jyp7WRT8VJmdsnulfHMZgHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
        </div>
        <div class="menu">
            <span>World</span>
            <span>US Politics</span>
            <span>Business</span>
            <span>Health</span>
            <span>Entertainment</span>
            <span>Style</span>
            <span>Travel</span>
            <span>Sports</span>
            <span>Videos</span>
        </div>
        <div class="right-menu">
            <span>Edition <select name="" id=""></select></span>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-circle-user"></i>
            <i class="fa-solid fa-bars"></i>
        </div>

    </nav>
</body>
</html>
