<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: whitesmoke;
            font-family: Arial, sans-serif;
        }
        .container{
            width: 600px;
            background-color: whitesmoke;
            border: 4px solid black;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header-box{
            background-color: blue;
            color: black;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border: 3px solid black;
        }
        .middle-section{
            display: flex;
            gap: 15px;
        }
        .sidebar-box{
            background-color: #2c2c2c;
            width: 35%;
            border: 3px solid black;
            height: 250px;
            border-radius: 10px;
        }
        .right-stacked{
            width: 65%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .flex-box{
            background-color: orangered;
            color: black;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border: 3px solid black;
        }
        .bottom-section{
            display: flex;
            gap: 15px;
        }
        .bottom-section .flex-box{
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">Flex</div>
        <div class="middle-section">
            <div class="sidebar-box"></div>
            <div class="right-stacked">
                <div class="flex-box">Flex</div>
                <div class="flex-box">Flex</div>
            </div>
        </div>
        <div class="bottom-section">
            <div class="flex-box">Flex</div>
            <div class="flex-box">Flex</div>
            <div class="flex-box">Flex</div>
        </div>  
    </div>

</body>
</html>
