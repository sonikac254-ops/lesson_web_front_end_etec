<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .line2{
            border: 1px solid black;
            background-color: blue;
            width: 100%;
            height: 50px;
            gap: 20px;

            justify-content: center;
            align-items: center;
            border-radius: 10px;
            
        }
        .aside{
            background-color: green;
            width: 45%;
            height: 200px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main{
            background-color: palevioletred;
            width: 45%;
            height: 200px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hello{
            background-color: orangered;
            width: 100%;
            height: 50px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            display: flex;
        }
    </style>
</head>
<body>
    <div class="line1">
        <header class="line2">
            Header
        </header>
        <div class="box">
            <div class="aside">Aside</div>
            <div class="main">Main</div>
        </div>
        <div class="hello">footer</div>

    </div>
</body>
</html>
