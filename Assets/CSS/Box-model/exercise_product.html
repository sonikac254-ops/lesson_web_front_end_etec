    <style>
        .product-card{
            width: 250px;
            /* height 350px; */
            border: 1px solid #ccc;
            padding: 15px;
            margin: 20px;
            border-radius: 10px;
            background-color: whitesmoke;
            font-family: Arial, sans-serif;
        }
        .product-card image{
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #a6a2a2;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .product-card h3{
            margin: 0 0 10px;
            font-size: 18px;
        }
        .product-card p{
            margin: 0 0 15px;
            font-size: 14px;
        }
        .product-card button{
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;

        }
        .product-card button:hover{
            background-color: rgb(5, 112, 235);
        }
