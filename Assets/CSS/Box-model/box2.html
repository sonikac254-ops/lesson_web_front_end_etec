<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Box</title>
    <style>
        .box-model{
            /* Content */
            width: 300px;
            height: 200px;
            /* padding (inside space) */
            padding-top: 65px;
            padding-right: 25px;
            padding-bottom: 20px;
            padding-left: 25px;
            /* border */
            border-top: 4px solid red;
            border-right: 4px dashed blue;
            border-bottom: 4px dotted green;
            border-left: 4px double black;
            border-radius: 12px;
            /* Margin (outside space) */
            margin-top: 30px;
            margin-right: 40px;
            margin-bottom: 30px;
            margin-bottom: 40px;
            /* Box-sizing */
            box-sizing: border-box;
            /* Text style (just for view ) */
            font-family: sans-serif;
            font-size: 20px;
            text-align: center;
            background-color:  rgba(135, 207, 235, 0.444);

        }

    </style>
</head>
<body>
    <div class="box-model">
        This a Box whit width, height, margin, padding, border, box-sizing
    </div>
</body>
</html>
