<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
             border: 1px solid black;
            width: 500px;
            height: auto;
            display: grid;
            grid-template-columns: repeat(4,1fr);
           
        }
        .box{
            grid-row: 1;
            background-color: green;
            height: 100px;
            display: flex;
            font-weight: bold;
            justify-content: center;
            align-items: center;
            border: 3px solid white;

        }
        .box1{
            background-color: aqua;
            grid-row: span 3;
        }
        .box2{
            background-color: blanchedalmond;
            grid-row: span 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        <div class="box7"></div>

    </div>
</body>
</html>
