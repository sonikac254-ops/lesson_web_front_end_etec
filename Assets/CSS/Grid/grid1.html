<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 1px solid black;
            width: 700px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }
        .box{
            background-color: cadetblue;
            height: 90px;
        }
        .header{
            grid-column: 1/4;
            grid-row: 1;
            height: 90px;
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
