<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .banner{
            width: min(1250px -32px ,100%);
            background-image:url(https://static.vecteezy.com/system/resources/thumbnails/004/707/493/small_2x/online-shopping-on-phone-buy-sell-business-digital-web-banner-application-money-advertising-payment-ecommerce-illustration-search-vector.jpg) ;
            background-repeat: no-repeat;
            background-size: cover;
            height: 400px;
            background-color: bisque;
            margin: auto;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .button{
            display: flex;
            margin-top: 370px;
        }
        .banner button{
            height: 30px;
            border-radius: 10px;
            width: 250px;
            border: none;
            font-weight: bold;
            font-size: 18px;
            color: grey;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;

        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="button">
        <button>BUY NOW</button>
        </div>
    </div>
</body>
</html>
