<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Unordered list Exercise</h1>

    <h2>Example 1: Fruits</h2>
    
    <ul style="list-style-type: disc;">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
    </ul>
    <h2>Example 2: School Supplies</h2>
    <ul style="list-style-type: square;">
        <li>Pen</li>
        <li>Notebook</li>
        <li>Ruler</li>
        <li>Eraser</li>
    </ul>
    <h2>Example 3: Hobbies</h2>
    <ul style="list-style-type: circle;">
        <li>Reading</li>
        <li>Running</li>
        <li>Listening</li>
        <li>Playing volleyball</li>
    </ul>
</body>
</html>
